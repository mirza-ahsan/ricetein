[project]
name = "ricetein"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=1.33.0",
    "imagehash>=4.3.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jinja2>=3.1.6",
    "jupyterlab>=4.6.4",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.4.6",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "timm>=1.0.30",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "transformers>=4.56",
    "umap-learn>=0.5.12",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project]
name = "ricetein"
version = "0.1.0"
description = "Resolution-preserving weakly supervised rice leaf disease recognition"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub>=1.33.0",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "timm>=1.0.30",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "transformers>=4.56",
    "umap-learn>=0.5.12",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# Installed on the local machine only (uv sync installs both groups by default).
# Kept out of the main dependencies so they are NOT exported to Kaggle:
# reinstalling Jupyter packages inside a running Kaggle notebook can break it.
[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
notebook = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "nbformat>=5.11.1",
]

[tool.uv]
default-groups = ["dev", "notebook"]

# Install the project itself (editable) so `import src` works from any folder,
# including notebooks/ where Jupyter's working directory is the notebook's folder.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

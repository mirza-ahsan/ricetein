# swin_tiny at 224 px retrained on the session-blocked split with the learning rate chosen on the locked
# split. `swin_tiny_session` is the same pinned model as `swin_tiny`; the separate name keeps the run
# folders of the two splits apart (stage5_swin_tiny_session_224_lr..._r...).
extends: ../wholeimage/swin_tiny_224.yaml
split_files:
  folds: splits/session_blocked/folds.csv
wholeimage:
  model: swin_tiny_session
  models:
    swin_tiny_session:
      repo: timm/swin_tiny_patch4_window7_224.ms_in1k
      revision: 4cc3a7275b50b53a7bec45f32c236ebe64227cff
      size_kwargs:
        128:
          img_size: 128
          window_size: 4
        224:
          img_size: 224
        448:
          img_size: 448
        512:
          img_size: 512

# efficientnetv2s at 224 px retrained on the session-blocked split with the learning rate chosen on the locked
# split. `efficientnetv2s_session` is the same pinned model as `efficientnetv2s`; the separate name keeps the run
# folders of the two splits apart (stage5_efficientnetv2s_session_224_lr..._r...).
extends: ../wholeimage/efficientnetv2s_224.yaml
split_files:
  folds: splits/session_blocked/folds.csv
wholeimage:
  model: efficientnetv2s_session
  models:
    efficientnetv2s_session:
      repo: timm/tf_efficientnetv2_s.in1k
      revision: 3af791b42d7e895c9da9b5aa4ed4e6b648e4ac0b

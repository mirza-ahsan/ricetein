# ===================================================================
# configs/partition_order.yaml: Stage 9, how much do testing mistakes inflate scores? (declared 2026-11-20)
# ===================================================================
# Condition A is the correct protocol: the existing session-blocked runs of the two models, reused as they are.
# Conditions B, C and D are DELIBERATELY WRONG demonstrations. They never enter tuning, selection or any
# other table. They reuse A's selected settings (nothing is tuned) and have their own split files.
#   B  augment first, then split the copies at random   (versions of one photo land on both sides)
#   C  correct order, but near-duplicate groups and capture blocks ignored (random photo split)
#   D  train on every photo and score on every photo
# See handbook Stage 9 and §24 (2026-11-20). Run names: stage9_<model>_<condition>_r<round>.
# ===================================================================
extends: session/split.yaml

partition_order:
  models: [efficientnetv2s, attention]
  conditions: [B, C, D]
  versions: 8                      # copies per photo in B: 1 clean + 7 augmented (the same 8 versions as the E1 cache)
                                   # B takes as many training copies per epoch as A has training photos (step-matched)
  split_seed_offset: {B: 1000, C: 2000}   # split seed = split_seed + offset (+ round for the validation draw)
  d_seeds: [0, 1, 2, 3, 4]         # D: one training seed per repeat; D stops at A's best epoch of the same round
  copy_cache: cache/partition_order/copies_224
  # Condition A: runs of runs/session_selection.json (the headline selection). Reference row L: the locked-split
  # headline runs of runs/followup_selection.json (their own selected settings, not A's).
  a_selection: session_selection.json
  a_methods: {efficientnetv2s: efficientnetv2s_224, attention: attention}
  l_selection: followup_selection.json
  l_methods: {efficientnetv2s: efficientnetv2s_224, attention: attention}

wholeimage:                        # the resized-photo cache of the main protocol (shared with Stage 5)
  cache_dir: cache/wholeimage
  workers: 3                       # processes that build a missing cache
